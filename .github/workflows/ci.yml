name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npx vitest run
      env:
        JWT_SECRET: "ci-test-secret-key-do-not-use"
        
    - name: Build Next.js
      run: npm run build
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
        JWT_SECRET: "ci-test-secret-key-do-not-use"
